name: Offline validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked --python "${{ matrix.python }}" --extra campaign --extra dev
      - run: python scripts/verify_release.py
      - run: uv run --locked --extra campaign --extra dev pytest
      - run: python paper/scripts/recompute_results.py

